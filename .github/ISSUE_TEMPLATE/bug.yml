name: Bug report
description: Something is broken or behaves differently from SPEC.md.
labels: ['bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, ai, infra, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact any secrets or tokens.
      render: shell
